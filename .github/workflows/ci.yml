name: Build and Push Docker Image
on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint HTML files with HTMLHint
        run: |
          npm install -g htmlhint
          htmlhint **/*.html

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'docker.io/${{ secrets.DOCKERHUB_USERNAME }}/virtual-zoo:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true

          tags: shyam2210/virtual-zoo:latest
          
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0

      - name: Install Prometheus using Helm
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          # Install the prometheus stack in its own 'monitoring' namespace
          helm install prometheus prometheus-community/kube-prometheus-stack --namespace monitoring --create-namespace --wait
          
      - name: Install Ansible dependencies
        run: pip install ansible openshift

      - name: Install Kubernetes collection for Ansible
        run: ansible-galaxy collection install kubernetes.core

      - name: Run Ansible Playbook
        run: ansible-playbook deploy.yml

      - name: Verify deployments
        run: |
          echo "Verifying application pods..."
          kubectl wait --for=condition=available --timeout=60s deployment/virtual-zoo-deployment -n default
          echo "Verifying monitoring pods..."
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=prometheus -n monitoring --timeout=120s
          echo "All pods are running!"
  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Create kind cluster # Must recreate the same context
        uses: helm/kind-action@v1.10.0

      - name: Run smoke test
        run: |
          echo "Waiting for pods to be ready..."
          kubectl wait --for=condition=available --timeout=60s deployment/virtual-zoo-deployment
          echo "Forwarding port..."
          kubectl port-forward svc/virtual-zoo-service 8080:80 &
          sleep 5
          echo "Testing endpoint..."
          curl --fail http://localhost:8080
